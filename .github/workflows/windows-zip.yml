name: Build Windows ZIP

# Builds the portable Windows download (embedded Python + bundled Poppler), then runs it for real.
# Start it by hand (Actions tab > Build Windows ZIP > Run workflow) or by pushing a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test the Windows ZIP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Windows Server 2025; windows-2022 is the closest to Windows 10/11 21H2.
        os: [windows-latest, windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.17"

      - name: Install the build helper
        run: python -m pip install pefile

      - name: Build the ZIP
        run: python windows/build_windows_zip.py --out dist/Shadow-Reader-windows.zip

      - name: Run the ZIP like a user would (bundled Python, bundled Poppler, real PDF)
        run: python windows/smoke_test_zip.py dist/Shadow-Reader-windows.zip

      - name: Keep the ZIP
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: Shadow-Reader-windows
          path: dist/Shadow-Reader-windows.zip
          if-no-files-found: error
