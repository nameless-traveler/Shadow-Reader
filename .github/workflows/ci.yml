
name: Shadow Reader CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install Poppler (real pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run parser regression tests
        run: node tests/parser-regression.cjs

      - name: Run reading progress tests
        run: node tests/resume-feature-regression.cjs

      - name: Run Focus Here tests
        run: node tests/focus-here-feature-regression.cjs

      - name: Run server API tests
        run: python3 tests/server-api-regression.py

      - name: Run extractor lookup tests
        run: python3 tests/extractor-lookup-regression.py

      - name: Run Windows packaging tests
        run: python3 tests/windows-package-regression.py

      - name: Run release branding tests
        run: python3 tests/release-branding-regression.py

      - name: Run real PDF extraction test (real Poppler)
        run: python3 tests/real-pdf-extraction.py
 
      - name: Run logo route tests
        run: python3 tests/logo-route-regression.py

      - name: Run launcher (run.sh) tests
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh run.sh
          python3 tests/run-sh-regression.py

      - name: Run host/origin check tests
        run: python3 tests/host-check-regression.py
 
  browser-tests:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
 
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
 
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
 
      - name: Performance smoke test
        run: python3 tests/performance-browser-smoke.py
 
      - name: Virtualization smoke test
        run: python3 tests/virtualization-browser-smoke.py
 
      - name: Focus Here smoke test
        run: python3 tests/focus-here-browser-smoke.py
 
      - name: Continue Reading smoke test
        run: python3 tests/resume-browser-smoke.py
 
      - name: Touchpad scroll regression
        run: python3 tests/touchpad-scroll-behavior.py
 

  distro-tests:
    name: Real install on ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:13
          - name: Fedora
            image: fedora:latest
          - name: Arch Linux
            image: archlinux:latest
          - name: Alpine
            image: alpine:latest
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run launcher in a fresh container (installs Python and Poppler for real)
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD":/src:ro "$IMAGE" sh /src/tests/distro-smoke.sh /src

  windows-tests:
    name: Windows tests 
    runs-on: windows-latest
    timeout-minutes: 15


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poppler (Windows build)
        run: |
          choco install poppler -y --no-progress
          Get-Command pdftotext

      # Every step below runs even if an earlier one failed, so one run lists everything that breaks.
      - name: Parser regression tests
        if: ${{ !cancelled() }}
        run: node tests/parser-regression.cjs

      - name: Reading progress tests
        if: ${{ !cancelled() }}
        run: node tests/resume-feature-regression.cjs

      - name: Focus Here tests
        if: ${{ !cancelled() }}
        run: node tests/focus-here-feature-regression.cjs

      - name: Server API tests
        if: ${{ !cancelled() }}
        run: python tests/server-api-regression.py

      - name: Extractor lookup tests
        if: ${{ !cancelled() }}
        run: python tests/extractor-lookup-regression.py

      - name: Windows packaging tests
        if: ${{ !cancelled() }}
        run: python tests/windows-package-regression.py

      - name: Real PDF extraction (real Poppler)
        if: ${{ !cancelled() }}
        run: python tests/real-pdf-extraction.py

      - name: Release branding tests
        if: ${{ !cancelled() }}
        run: python tests/release-branding-regression.py

      - name: Logo route tests
        if: ${{ !cancelled() }}
        run: python tests/logo-route-regression.py

      - name: Host and origin tests
        if: ${{ !cancelled() }}
        run: python tests/host-check-regression.py

      - name: Launcher tests (skipped on Windows)
        if: ${{ !cancelled() }}
        run: python tests/run-sh-regression.py
